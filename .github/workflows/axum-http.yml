name: Axum HTTP smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, "1.75.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: axum-${{ matrix.toolchain }}
      - name: Build buffered HTTP server
        run: cargo build --locked -p razor-slices-axum --example server
      - name: Exercise real GET and rendering failure
        run: bash crates/razor-slices-axum/tests/server-smoke.sh
