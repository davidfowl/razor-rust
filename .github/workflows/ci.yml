name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - features: default
            cargo-flags: ""
          - features: all-features
            cargo-flags: "--all-features"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.features == 'default'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets ${{ matrix.cargo-flags }} -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets ${{ matrix.cargo-flags }}

      - name: Test
        run: cargo test --workspace ${{ matrix.cargo-flags }}

      - name: Run examples
        if: matrix.features == 'default'
        run: cargo run -p razor-slices --example hello

  docs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - features: default
            cargo-flags: ""
          - features: all-features
            cargo-flags: "--all-features"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Fails the build on broken intra-doc links / missing docs warnings,
      # matching the docs epic's "keep docs current" convention (#9).
      - name: cargo doc (deny warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --document-private-items ${{ matrix.cargo-flags }}

  msrv:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - features: default
            cargo-flags: ""
          - features: all-features
            cargo-flags: "--all-features"
    steps:
      - uses: actions/checkout@v4

      # Pin to the `rust-version` declared in the workspace manifest so a PR
      # that accidentally relies on a newer feature fails CI instead of
      # silently breaking the documented MSRV.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install MSRV Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Build with MSRV
        run: cargo build --workspace --all-targets ${{ matrix.cargo-flags }}

      - name: Test with MSRV
        run: cargo test --workspace ${{ matrix.cargo-flags }}
