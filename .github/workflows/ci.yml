name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - features: default
            cargo-flags: ""
          - features: all-features
            cargo-flags: "--all-features"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.features == 'default'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets ${{ matrix.cargo-flags }} -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets ${{ matrix.cargo-flags }}

      - name: Test
        run: cargo test --workspace ${{ matrix.cargo-flags }}

      - name: Test renamed runtime dependency
        if: matrix.features == 'default'
        run: cargo test --manifest-path crates/razor-slices/tests/renamed/Cargo.toml

      - name: Run examples
        if: matrix.features == 'default'
        run: |
          cargo run -p razor-slices --example hello
          cargo run -p razor-slices --example inline
          cargo run -p razor-slices --example todos > target/todos-output.html
          diff -u crates/razor-slices/tests/fixtures/todos.html target/todos-output.html
          cargo run -p razor-slices --example layout > target/layout-output.html
          diff -u crates/razor-slices/tests/fixtures/layout.html target/layout-output.html
          cargo run -p razor-slices --example sections > target/sections-output.html
          diff -u crates/razor-slices/tests/fixtures/sections.html target/sections-output.html
          cargo run -p razor-slices --example declared_layout > target/declared-layout-output.html
          diff -u crates/razor-slices/tests/fixtures/declared-layout.html target/declared-layout-output.html
          cargo run -p razor-slices --example integration > target/integration-output.html
          diff -u crates/razor-slices/tests/fixtures/integration.html target/integration-output.html

      - name: Verify incremental section example
        if: matrix.features == 'all-features'
        run: |
          cargo run -p razor-slices --example async_sections --features tokio > target/async-sections-output.txt
          diff -u crates/razor-slices/tests/fixtures/async_sections.txt target/async-sections-output.txt

      - name: Verify declared async template prefix handshake and stdout
        if: matrix.features == 'all-features'
        run: |
          cargo run -p razor-slices --example async_template --features tokio > target/async-template-output.txt
          diff -u crates/razor-slices/tests/fixtures/async_template.txt target/async-template-output.txt

      - name: Verify generated mixed-value prefix handshake and stdout
        if: matrix.features == 'all-features'
        run: |
          cargo run -p razor-slices --example async_values --features tokio > target/async-values-output.txt
          diff -u crates/razor-slices/tests/fixtures/async_values.txt target/async-values-output.txt

  docs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - features: default
            cargo-flags: ""
          - features: all-features
            cargo-flags: "--all-features"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Fails the build on broken intra-doc links / missing docs warnings,
      # matching the docs epic's "keep docs current" convention (#9).
      - name: cargo doc (deny warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --document-private-items ${{ matrix.cargo-flags }}

  msrv:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - features: default
            cargo-flags: ""
          - features: all-features
            cargo-flags: "--all-features"
    steps:
      - uses: actions/checkout@v4

      # Pin to the `rust-version` declared in the workspace manifest so a PR
      # that accidentally relies on a newer feature fails CI instead of
      # silently breaking the documented MSRV.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install MSRV Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Build with MSRV
        run: cargo build --workspace --all-targets ${{ matrix.cargo-flags }}

      - name: Test with MSRV
        run: cargo test --workspace ${{ matrix.cargo-flags }}

      - name: Test renamed runtime dependency with MSRV
        if: matrix.features == 'default'
        run: cargo test --manifest-path crates/razor-slices/tests/renamed/Cargo.toml

      - name: Verify integrated sample with MSRV
        run: |
          cargo run -p razor-slices --example integration ${{ matrix.cargo-flags }} > target/integration-output.html
          diff -u crates/razor-slices/tests/fixtures/integration.html target/integration-output.html

      - name: Verify async sample handshakes with MSRV
        if: matrix.features == 'all-features'
        run: |
          cargo run -p razor-slices --example async_sections --features tokio > target/async-sections-output.txt
          diff -u crates/razor-slices/tests/fixtures/async_sections.txt target/async-sections-output.txt
          cargo run -p razor-slices --example async_template --features tokio > target/async-template-output.txt
          diff -u crates/razor-slices/tests/fixtures/async_template.txt target/async-template-output.txt
          cargo run -p razor-slices --example async_values --features tokio > target/async-values-output.txt
          diff -u crates/razor-slices/tests/fixtures/async_values.txt target/async-values-output.txt
