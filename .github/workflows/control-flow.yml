name: Control-flow sample

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  sample-output:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, "1.75.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Run control-flow sample and compare exact stdout
        run: |
          mkdir -p target
          cargo run -p razor-slices --example control_flow > target/control-flow-output.html
          diff -u crates/razor-slices/tests/fixtures/control_flow.html target/control-flow-output.html
