[package]
name = "razor-slices"
description = "Lightweight, high-performance templates for Rust, inspired by RazorSlices for ASP.NET Core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Default-off: the core crate has no mandatory async-runtime dependency (see
# the design-decision comment on
# https://github.com/davidfowl/razor-rust/issues/11). Enable this feature to
# get a `tokio::io::AsyncWrite` adapter (`TokioWriter`) for streaming
# rendering, e.g. for the axum integration tracked in
# https://github.com/davidfowl/razor-rust/issues/6.
tokio = ["dep:tokio"]

[dependencies]
razor-slices-macros = { version = "0.1.0", path = "../razor-slices-macros" }
tokio = { version = "1", features = ["io-util"], optional = true }
# SIMD-accelerated byte scanning for the HTML encoder's run detection; see
# docs/adr/0005-simd-html-encoding.md.
memchr = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "io-util", "sync"] }

[[example]]
name = "incremental"
required-features = ["tokio"]

[[example]]
name = "async_sections"
required-features = ["tokio"]

[[example]]
name = "async_template"
required-features = ["tokio"]

[[example]]
name = "async_values"
required-features = ["tokio"]

[[example]]
name = "async_layout"
required-features = ["tokio"]
